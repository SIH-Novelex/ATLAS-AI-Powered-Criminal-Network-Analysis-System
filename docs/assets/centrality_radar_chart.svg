<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340" width="100%" height="100%">
  <defs>
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#0C1428" />
    </linearGradient>

    <radialGradient id="kingpinFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.2" />
    </radialGradient>

    <radialGradient id="muleFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00BBF9" stop-opacity="0.1" />
    </radialGradient>

    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePoly {
      0%, 100% { stroke-width: 2px; }
      50% { stroke-width: 3.5px; filter: drop-shadow(0 0 6px #FF0055); }
    }
    .poly-kingpin { animation: pulsePoly 3s infinite ease-in-out; }
    .radar-mono { font-family: 'Fira Code', 'Cascadia Code', monospace; }
    .radar-sans { font-family: 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="950" height="340" rx="14" fill="url(#spiderBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Title & Scope -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" fill="#00F5D4" class="radar-mono" font-size="14" font-weight="700" letter-spacing="1">
      GRAPH CENTRALITY RADAR • MATHEMATICAL TOPOLOGY COMPARISON
    </text>
    <text x="0" y="18" fill="#64748B" class="radar-mono" font-size="11">
      PageRank vs. Betweenness vs. Degree Centrality for Role Disambiguation
    </text>
  </g>

  <!-- Left Spider / Radar Chart (Center: 220, 195) -->
  <g transform="translate(220, 195)">
    <!-- Concentric Pentagons -->
    <!-- Level 1 (20%) -->
    <polygon points="0,-22 21,-7 13,18 -13,18 -21,-7" fill="none" stroke="#1E293B" stroke-width="1" />
    <!-- Level 2 (40%) -->
    <polygon points="0,-44 42,-14 26,36 -26,36 -42,-14" fill="none" stroke="#1E293B" stroke-width="1" />
    <!-- Level 3 (60%) -->
    <polygon points="0,-66 63,-20 39,53 -39,53 -63,-20" fill="none" stroke="#1E293B" stroke-width="1" />
    <!-- Level 4 (80%) -->
    <polygon points="0,-88 84,-27 52,71 -52,71 -84,-27" fill="none" stroke="#1E293B" stroke-width="1" />
    <!-- Level 5 (100%) -->
    <polygon points="0,-110 105,-34 65,89 -65,89 -105,-34" fill="none" stroke="#334155" stroke-width="1.5" />

    <!-- 5 Spoke Axis Lines -->
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="0" y1="0" x2="105" y2="-34" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="0" y1="0" x2="65" y2="89" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="0" y1="0" x2="-65" y2="89" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="0" y1="0" x2="-105" y2="-34" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Axis Labels -->
    <text x="0" y="-120" fill="#00F5D4" class="radar-mono" font-size="10" font-weight="700" text-anchor="middle">PageRank</text>
    <text x="115" y="-30" fill="#00BBF9" class="radar-mono" font-size="10" font-weight="700">Betweenness</text>
    <text x="75" y="105" fill="#FFD166" class="radar-mono" font-size="10" font-weight="700">Degree</text>
    <text x="-75" y="105" fill="#FF0055" class="radar-mono" font-size="10" font-weight="700" text-anchor="end">Hawala Volume</text>
    <text x="-115" y="-30" fill="#C77DFF" class="radar-mono" font-size="10" font-weight="700" text-anchor="end">Cross-Case</text>

    <!-- Mule Profile Polygon (High Degree, Low Betweenness) -->
    <polygon points="0,-40 28,-9 58,80 -25,35 -20,-7" fill="url(#muleFill)" stroke="#00F5D4" stroke-width="1.5" />

    <!-- Kingpin Profile Polygon (High on Everything) -->
    <polygon class="poly-kingpin" points="0,-102 98,-31 45,62 -60,82 -98,-31" fill="url(#kingpinFill)" stroke="#FF0055" stroke-width="2" filter="url(#radarGlow)" />
  </g>

  <!-- Right Side Breakdown & Explanation -->
  <g transform="translate(480, 70)">
    <!-- Legend -->
    <g transform="translate(0, 0)">
      <!-- Kingpin Marker -->
      <rect width="16" height="16" rx="3" fill="#FF0055" />
      <text x="26" y="13" fill="#FFFFFF" class="radar-sans" font-size="13" font-weight="700">
        Vikram Singh (Syndicate Kingpin Profile)
      </text>
      <text x="26" y="28" fill="#94A3B8" class="radar-sans" font-size="11">
        Dominates PageRank (0.084) &amp; Betweenness (0.421). High-value financial gatekeeper.
      </text>

      <!-- Mule Marker -->
      <g transform="translate(0, 45)">
        <rect width="16" height="16" rx="3" fill="#00F5D4" />
        <text x="26" y="13" fill="#FFFFFF" class="radar-sans" font-size="13" font-weight="700">
          Rahul Varma (Mule / Terminal Node Profile)
        </text>
        <text x="26" y="28" fill="#94A3B8" class="radar-sans" font-size="11">
          High transaction frequency &amp; degree, but near-zero Betweenness (0.008). Easily replaced.
        </text>
      </g>
    </g>

    <!-- Technical Takeaway Box -->
    <g transform="translate(0, 115)">
      <rect width="430" height="115" rx="8" fill="#090E1F" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="24" fill="#FFD166" class="radar-mono" font-size="11" font-weight="700">
        WHY GRAPH CENTRALITY DEFEATS RELATIONAL SQL:
      </text>
      <text x="14" y="46" fill="#CBD5E1" class="radar-sans" font-size="11">
        • SQL queries only count raw records (e.g. number of calls or bank transfers).
      </text>
      <text x="14" y="66" fill="#CBD5E1" class="radar-sans" font-size="11">
        • Kingpins purposely keep low direct call counts, relying on couriers.
      </text>
      <text x="14" y="86" fill="#00F5D4" class="radar-sans" font-size="11" font-weight="600">
        • Our Betweenness algorithm mathematically exposes kingpins as bridges
      </text>
      <text x="14" y="102" fill="#00F5D4" class="radar-sans" font-size="11" font-weight="600">
        connecting otherwise disconnected criminal sub-clusters.
      </text>
    </g>
  </g>
</svg>

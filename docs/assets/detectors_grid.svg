<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>

    <linearGradient id="critBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>

    <linearGradient id="highBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#B5179E" />
    </linearGradient>

    <linearGradient id="medBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F77F00" />
      <stop offset="100%" stop-color="#FCBF49" />
    </linearGradient>

    <linearGradient id="analyticBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <filter id="tileGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseTile {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.8; }
    }
    .tile-border { animation: pulseTile 4s infinite alternate; }
    .font-title { font-family: 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .font-desc { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
    .font-code { font-family: 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Background -->
  <rect width="1000" height="380" rx="14" fill="url(#gridBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Section Header -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" fill="#00F5D4" class="font-title" font-size="16" letter-spacing="1.5">
      10 SCOPED CYPHER PATTERN DETECTORS
    </text>
    <text x="0" y="18" fill="#64748B" class="font-code" font-size="11">
      Continuous Algorithmic Scans Across Multi-Jurisdiction Property Graphs
    </text>
    <rect x="800" y="-12" width="140" height="26" rx="6" fill="#00E676" fill-opacity="0.1" stroke="#00E676" stroke-width="1" />
    <circle cx="815" cy="1" r="3.5" fill="#00E676" />
    <text x="826" y="5" fill="#00E676" class="font-code" font-size="11" font-weight="700">10 / 10 ONLINE</text>
  </g>

  <!-- ROW 1 (5 Tiles) -->
  <!-- Tile 1: Frequent Caller -->
  <g transform="translate(30, 70)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#7928CA" stroke-width="1.5" />
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#highBadge)" />
    <text x="44" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">HIGH</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">1. Frequent Caller</text>
    <text x="12" y="70" class="font-desc">Anomalous call spikes</text>
    <text x="12" y="86" class="font-desc">&gt;30 calls in narrow</text>
    <text x="12" y="102" class="font-desc">temporal intervals.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: CALL_LOG</text>
  </g>

  <!-- Tile 2: Burner SIM -->
  <g transform="translate(222, 70)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#FF0055" stroke-width="1.5" />
    <rect x="12" y="12" width="75" height="18" rx="4" fill="url(#critBadge)" />
    <text x="49" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">CRITICAL</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">2. Burner SIM Swap</text>
    <text x="12" y="70" class="font-desc">Multiple MSISDNs</text>
    <text x="12" y="86" class="font-desc">recycled on identical</text>
    <text x="12" y="102" class="font-desc">IMEI hardware.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: USED_IMEI</text>
  </g>

  <!-- Tile 3: Hawala Money Laundering -->
  <g transform="translate(414, 70)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#FF0055" stroke-width="1.5" />
    <rect x="12" y="12" width="75" height="18" rx="4" fill="url(#critBadge)" />
    <text x="49" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">CRITICAL</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">3. Hawala Laundering</text>
    <text x="12" y="70" class="font-desc">Rapid fund layering</text>
    <text x="12" y="86" class="font-desc">across 3+ nominee</text>
    <text x="12" y="102" class="font-desc">mule accounts.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: TRANSFERRED</text>
  </g>

  <!-- Tile 4: Mule Account Syndicate -->
  <g transform="translate(606, 70)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#7928CA" stroke-width="1.5" />
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#highBadge)" />
    <text x="44" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">HIGH</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">4. Mule Accounts</text>
    <text x="12" y="70" class="font-desc">Dormant accounts</text>
    <text x="12" y="86" class="font-desc">suddenly receiving</text>
    <text x="12" y="102" class="font-desc">high-value spikes.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: SUDDEN_FLOW</text>
  </g>

  <!-- Tile 5: Cross-Case Suspect Overlap -->
  <g transform="translate(798, 70)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#FF0055" stroke-width="1.5" />
    <rect x="12" y="12" width="75" height="18" rx="4" fill="url(#critBadge)" />
    <text x="49" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">CRITICAL</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">5. Cross-Case Link</text>
    <text x="12" y="70" class="font-desc">Identical suspects</text>
    <text x="12" y="86" class="font-desc">or assets appearing in</text>
    <text x="12" y="102" class="font-desc">separate FIRs.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: MULTI_CASE</text>
  </g>

  <!-- ROW 2 (5 Tiles) -->
  <!-- Tile 6: Convoy Movement -->
  <g transform="translate(30, 220)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#F77F00" stroke-width="1.5" />
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#medBadge)" />
    <text x="44" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">MEDIUM</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">6. Vehicle Convoy</text>
    <text x="12" y="70" class="font-desc">Co-moving vehicles</text>
    <text x="12" y="86" class="font-desc">logged by CCTV ANPR</text>
    <text x="12" y="102" class="font-desc">within 5m windows.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: ANPR_ROUTE</text>
  </g>

  <!-- Tile 7: Co-Location -->
  <g transform="translate(222, 220)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#7928CA" stroke-width="1.5" />
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#highBadge)" />
    <text x="44" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">HIGH</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">7. Crime Scene Co-Loc</text>
    <text x="12" y="70" class="font-desc">Concurrent antenna</text>
    <text x="12" y="86" class="font-desc">sector pings during</text>
    <text x="12" y="102" class="font-desc">crime timestamp.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: TOWER_SECTOR</text>
  </g>

  <!-- Tile 8: Meeting Clusters -->
  <g transform="translate(414, 220)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#F77F00" stroke-width="1.5" />
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#medBadge)" />
    <text x="44" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">MEDIUM</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">8. Meeting Clusters</text>
    <text x="12" y="70" class="font-desc">Dense graph cliques</text>
    <text x="12" y="86" class="font-desc">of co-accused</text>
    <text x="12" y="102" class="font-desc">physical meetings.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: CLIQUE_DENSE</text>
  </g>

  <!-- Tile 9: Shell Company Rings -->
  <g transform="translate(606, 220)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#F77F00" stroke-width="1.5" />
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#medBadge)" />
    <text x="44" y="24" fill="#FFF" class="font-code" font-size="9" font-weight="700" text-anchor="middle">MEDIUM</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">9. Shell Company</text>
    <text x="12" y="70" class="font-desc">Multiple corporations</text>
    <text x="12" y="86" class="font-desc">sharing dummy</text>
    <text x="12" y="102" class="font-desc">registered addresses.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: DUMMY_ADDR</text>
  </g>

  <!-- Tile 10: Kingpin Centrality -->
  <g transform="translate(798, 220)">
    <rect class="tile-border" width="176" height="135" rx="8" fill="#0B1120" stroke="#00F5D4" stroke-width="1.5" />
    <rect x="12" y="12" width="70" height="18" rx="4" fill="url(#analyticBadge)" />
    <text x="47" y="24" fill="#000" class="font-code" font-size="9" font-weight="700" text-anchor="middle">ANALYTIC</text>
    <text x="12" y="52" fill="#FFFFFF" class="font-title" font-size="12">10. Kingpin Rank</text>
    <text x="12" y="70" class="font-desc">PageRank + Degree</text>
    <text x="12" y="86" class="font-desc">+ Betweenness</text>
    <text x="12" y="102" class="font-desc">commander scoring.</text>
    <text x="12" y="122" fill="#00F5D4" class="font-code" font-size="10">CYPHER: CENTRALITY</text>
  </g>
</svg>

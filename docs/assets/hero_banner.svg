<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>

    <!-- Neon Glow Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F77F00" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes packetFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes textCycle {
      0%, 20% { opacity: 1; }
      25%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes textCycle2 {
      0%, 20% { opacity: 0; }
      25%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes textCycle3 {
      0%, 45% { opacity: 0; }
      50%, 70% { opacity: 1; }
      75%, 100% { opacity: 0; }
    }
    @keyframes textCycle4 {
      0%, 70% { opacity: 0; }
      75%, 95% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(340px); }
    }

    .radar-line {
      transform-origin: 850px 170px;
      animation: radarSpin 8s linear infinite;
    }
    .node-pulse {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    .flow-edge {
      stroke-dasharray: 6, 6;
      animation: packetFlow 1.5s linear infinite;
    }
    .cursor {
      animation: blinkCursor 0.8s infinite;
    }
    .msg-1 { animation: textCycle 12s infinite; }
    .msg-2 { animation: textCycle2 12s infinite; }
    .msg-3 { animation: textCycle3 12s infinite; }
    .msg-4 { animation: textCycle4 12s infinite; }
    .scan-bar {
      animation: scanline 6s linear infinite;
      opacity: 0.15;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1000" height="340" rx="16" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="2" />
  <circle cx="500" cy="170" r="400" fill="url(#centerGlow)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.08" stroke="#00F5D4" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
  </g>

  <!-- Interactive Radar Sweep on Right Side -->
  <g opacity="0.25">
    <circle cx="850" cy="170" r="110" fill="none" stroke="#00F5D4" stroke-width="1" />
    <circle cx="850" cy="170" r="75" fill="none" stroke="#00F5D4" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="850" cy="170" r="40" fill="none" stroke="#00F5D4" stroke-width="1" />
    <line x1="850" y1="50" x2="850" y2="290" stroke="#00F5D4" stroke-width="1" stroke-opacity="0.5" />
    <line x1="730" y1="170" x2="970" y2="170" stroke="#00F5D4" stroke-width="1" stroke-opacity="0.5" />
    <line class="radar-line" x1="850" y1="170" x2="960" y2="170" stroke="#00F5D4" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Animated Crime Network Topology -->
  <g opacity="0.85">
    <!-- Edges with Animated Flowing Packets -->
    <line class="flow-edge" x1="780" y1="120" x2="860" y2="80" stroke="#00F5D4" stroke-width="2" />
    <line class="flow-edge" x1="860" y1="80" x2="930" y2="140" stroke="#F72585" stroke-width="2" />
    <line class="flow-edge" x1="860" y1="80" x2="840" y2="230" stroke="#FFD166" stroke-width="1.5" />
    <line class="flow-edge" x1="780" y1="120" x2="840" y2="230" stroke="#00BBF9" stroke-width="2" />
    <line class="flow-edge" x1="840" y1="230" x2="930" y2="210" stroke="#4CC9F0" stroke-width="2" />

    <!-- Nodes with Threat-Specific Rings -->
    <!-- Kingpin Node -->
    <g class="node-pulse" transform="translate(0, 0)">
      <circle cx="860" cy="80" r="14" fill="#F72585" fill-opacity="0.3" filter="url(#glow)" />
      <circle cx="860" cy="80" r="8" fill="#F72585" stroke="#FFFFFF" stroke-width="2" />
      <text x="860" y="60" fill="#FF4D8D" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">KINGPIN</text>
    </g>

    <!-- Mule Account Node -->
    <circle cx="780" cy="120" r="10" fill="#00F5D4" fill-opacity="0.2" filter="url(#glowSubtle)" />
    <circle cx="780" cy="120" r="6" fill="#00F5D4" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="760" y="140" fill="#00F5D4" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">MULE_ACCT</text>

    <!-- Burner Phone Node -->
    <circle cx="930" cy="140" r="10" fill="#FFD166" fill-opacity="0.2" filter="url(#glowSubtle)" />
    <circle cx="930" cy="140" r="6" fill="#FFD166" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="945" y="144" fill="#FFD166" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">BURNER_SIM</text>

    <!-- Hawala Wire Node -->
    <circle cx="840" cy="230" r="12" fill="#7209B7" fill-opacity="0.3" filter="url(#glowSubtle)" />
    <circle cx="840" cy="230" r="7" fill="#B5179E" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="840" y="255" fill="#C77DFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">HAWALA_HUB</text>

    <!-- Convoy Vehicle Node -->
    <circle cx="930" cy="210" r="9" fill="#4CC9F0" fill-opacity="0.2" />
    <circle cx="930" cy="210" r="5" fill="#4CC9F0" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="945" y="215" fill="#4CC9F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">CONVOY_CAR</text>
  </g>

  <!-- Left Content Branding & Headers -->
  <!-- Top Category Chip -->
  <g transform="translate(60, 48)">
    <rect width="250" height="26" rx="13" fill="#00F5D4" fill-opacity="0.1" stroke="#00F5D4" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="15" cy="13" r="4" fill="#00F5D4" filter="url(#glow)" />
    <text x="28" y="17" fill="#00F5D4" font-family="'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="1.5">DEFENSE &amp; LAW ENFORCEMENT</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="125" fill="url(#neonCyan)" font-family="'Segoe UI', 'Montserrat', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5" filter="url(#glowSubtle)">
    AI-POWERED CRIMINAL NETWORK
  </text>
  <text x="60" y="165" fill="#FFFFFF" font-family="'Segoe UI', 'Montserrat', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="2">
    ANALYSIS SYSTEM
  </text>

  <!-- Subtitle -->
  <text x="60" y="200" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="1">
    FORENSIC GRAPH INTELLIGENCE • 10 CYPHER DETECTORS • GEMINI 2.5 COPILOT
  </text>

  <!-- Futuristic Animated Terminal Log Box -->
  <g transform="translate(60, 230)">
    <!-- Terminal Background -->
    <rect width="600" height="60" rx="8" fill="#050811" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Status Indicator -->
    <circle cx="20" cy="30" r="4" fill="#00E676" filter="url(#glowSubtle)" />
    <text x="32" y="34" fill="#64748B" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="12" font-weight="600">LIVE_TELEMETRY &gt;</text>

    <!-- Animated Cycling Messages -->
    <g font-family="'Fira Code', 'Cascadia Code', monospace" font-size="12" font-weight="500">
      <text class="msg-1" x="170" y="34" fill="#00F5D4">
        [DETECT] 10 Scoped Suspicious Pattern Detectors Armed &amp; Scanning...
      </text>
      <text class="msg-2" x="170" y="34" fill="#FFD166">
        [FUSION] Multi-Jurisdiction FIR, CDR &amp; Banking Records Linked.
      </text>
      <text class="msg-3" x="170" y="34" fill="#C77DFF">
        [COPILOT] Gemini 2.5 Flash Autonomous Topology Reasoner Online.
      </text>
      <text class="msg-4" x="170" y="34" fill="#00BBF9">
        [LEDGER] Cryptographic SHA-256 Merkle Chain-of-Custody Verified.
      </text>
    </g>

    <!-- Blinking Neon Cursor -->
    <rect class="cursor" x="635" y="22" width="8" height="16" fill="#00F5D4" />
  </g>

  <!-- Animated Laser Scan Line Overlay -->
  <line class="scan-bar" x1="0" y1="0" x2="1000" y2="0" stroke="#00F5D4" stroke-width="2" filter="url(#glow)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 450" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#090C16" />
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>

    <filter id="glowTerm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseCard {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.8; }
    }
    .term-cursor { animation: blink 0.9s infinite; }
    .pulse-border { animation: pulseCard 3s ease-in-out infinite; }
    .mono-text { font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace; }
  </style>

  <!-- Outer Window Container -->
  <rect width="950" height="450" rx="14" fill="url(#termBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Window Header Bar -->
  <rect width="950" height="40" rx="14" fill="#0E1726" />
  <rect y="26" width="950" height="14" fill="#0E1726" />
  <line x1="0" y1="40" x2="950" y2="40" stroke="#1E293B" stroke-width="1.5" />

  <!-- Mac / Linux Window Controls -->
  <circle cx="25" cy="20" r="6" fill="#FF5F56" />
  <circle cx="45" cy="20" r="6" fill="#FFBD2E" />
  <circle cx="65" cy="20" r="6" fill="#27C93F" />

  <!-- Tab Bar -->
  <g transform="translate(105, 8)">
    <rect width="210" height="26" rx="6" fill="#1E293B" stroke="#7928CA" stroke-width="1" />
    <circle cx="15" cy="13" r="3.5" fill="#7928CA" filter="url(#glowTerm)" />
    <text x="26" y="17" fill="#FFFFFF" class="mono-text" font-size="11" font-weight="600">gemini-copilot.sh [LIVE]</text>
  </g>
  <g transform="translate(325, 8)">
    <rect width="160" height="26" rx="6" fill="#0B101D" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="17" fill="#64748B" class="mono-text" font-size="11">neo4j-graph.cy</text>
  </g>
  <g transform="translate(495, 8)">
    <rect width="170" height="26" rx="6" fill="#0B101D" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="17" fill="#64748B" class="mono-text" font-size="11">sha256-ledger.json</text>
  </g>

  <!-- Query Section -->
  <g transform="translate(30, 60)">
    <rect width="890" height="48" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="18" y="22" fill="#00F5D4" class="mono-text" font-size="11" font-weight="700">🔍 INVESTIGATOR QUERY</text>
    <text x="18" y="38" fill="#F3F4F6" class="mono-text" font-size="13" font-weight="500">
      &gt; "Summarize the key suspects, explain how funds are being moved, and check for cross-case overlap."
    </text>
    <rect class="term-cursor" x="850" y="27" width="8" height="14" fill="#00F5D4" />
  </g>

  <!-- Response Section (Gemini 2.5 Flash Autonomous Intelligence) -->
  <g transform="translate(30, 122)">
    <!-- Main Card Body -->
    <rect class="pulse-border" width="890" height="300" rx="10" fill="#0A0E1A" stroke="#7928CA" stroke-width="1.5" />

    <!-- Copilot Badge Header -->
    <g transform="translate(20, 16)">
      <rect width="320" height="26" rx="6" fill="url(#purpleGradient)" filter="url(#glowTerm)" />
      <text x="14" y="18" fill="#FFFFFF" class="mono-text" font-size="12" font-weight="800" letter-spacing="0.5">
        🤖 GEMINI 2.5 FLASH COPILOT RESPONSE
      </text>
      <rect x="330" y="0" width="130" height="26" rx="6" fill="#00E676" fill-opacity="0.15" stroke="#00E676" stroke-width="1" />
      <text x="342" y="17" fill="#00E676" class="mono-text" font-size="11" font-weight="700">● REAL-TIME AI</text>
    </g>

    <!-- Content Row 1: Kingpin Identification -->
    <g transform="translate(20, 58)">
      <circle cx="8" cy="8" r="4" fill="#F72585" filter="url(#glowTerm)" />
      <text x="20" y="12" fill="#FF4D8D" class="mono-text" font-size="13" font-weight="700">
        PRIMARY SUSPECT IDENTIFIED: Vikram Singh (Central Kingpin)
      </text>
      <text x="30" y="32" fill="#94A3B8" class="mono-text" font-size="12">
        • Centrality Metrics: <tspan fill="#00F5D4" font-weight="700">PageRank: 0.084 (Rank #1)</tspan> | <tspan fill="#00BBF9" font-weight="700">Betweenness Centrality: 0.421 (Syndicate Bridge)</tspan>
      </text>
      <text x="30" y="50" fill="#94A3B8" class="mono-text" font-size="12">
        • Cross-Case Link: Bridges <tspan fill="#FFD166" font-weight="600">CASE-2024-001 (Homicide)</tspan> and <tspan fill="#FFD166" font-weight="600">CASE-2024-002 (Corporate Hawala Fraud)</tspan>
      </text>
    </g>

    <!-- Content Row 2: Financial Laundering Flow Visualizer -->
    <g transform="translate(20, 126)">
      <circle cx="8" cy="8" r="4" fill="#FFD166" filter="url(#glowTerm)" />
      <text x="20" y="12" fill="#FFD166" class="mono-text" font-size="13" font-weight="700">
        FINANCIAL LAUNDERING TRAIL (Hawala Pattern Detected):
      </text>
      <!-- Flow Diagram Boxes in Terminal -->
      <g transform="translate(30, 24)">
        <rect width="180" height="28" rx="6" fill="#1E293B" stroke="#00F5D4" stroke-width="1" />
        <text x="90" y="18" fill="#00F5D4" class="mono-text" font-size="11" font-weight="600" text-anchor="middle">ACCT-001 (Vikram)</text>
        
        <path d="M 185 14 L 235 14" stroke="#FFD166" stroke-width="2" stroke-dasharray="3,3" />
        <text x="210" y="10" fill="#FFD166" class="mono-text" font-size="9" text-anchor="middle">₹500,000</text>

        <rect x="240" width="180" height="28" rx="6" fill="#1E293B" stroke="#FF5F56" stroke-width="1" />
        <text x="330" y="18" fill="#FF5F56" class="mono-text" font-size="11" font-weight="600" text-anchor="middle">ACCT-002 (Mule: Rahul)</text>

        <path d="M 425 14 L 475 14" stroke="#FFD166" stroke-width="2" stroke-dasharray="3,3" />
        <text x="450" y="10" fill="#FFD166" class="mono-text" font-size="9" text-anchor="middle">14 mins</text>

        <rect x="480" width="220" height="28" rx="6" fill="#1E293B" stroke="#A78BFA" stroke-width="1" />
        <text x="590" y="18" fill="#A78BFA" class="mono-text" font-size="11" font-weight="600" text-anchor="middle">ACCT-003 &amp; 004 (Layered)</text>
      </g>
    </g>

    <!-- Content Row 3: Co-Location Alert & Failover Protection -->
    <g transform="translate(20, 204)">
      <circle cx="8" cy="8" r="4" fill="#00F5D4" filter="url(#glowTerm)" />
      <text x="20" y="12" fill="#00F5D4" class="mono-text" font-size="13" font-weight="700">
        SPATIAL-TEMPORAL CO-LOCATION ALERT:
      </text>
      <text x="30" y="30" fill="#E2E8F0" class="mono-text" font-size="12">
        • Cell Tower Sector-4 logged concurrent ping from +91-98765-43210 &amp; +91-91234-56789 during murder window.
      </text>
    </g>

    <!-- Footer Status Row -->
    <g transform="translate(20, 260)">
      <line x1="0" y1="0" x2="850" y2="0" stroke="#1E293B" stroke-width="1" />
      <circle cx="8" cy="18" r="4" fill="#00E676" />
      <text x="20" y="22" fill="#64748B" class="mono-text" font-size="11">
        CONFIDENCE: <tspan fill="#00E676" font-weight="700">98.4%</tspan> | EVIDENCE LEDGER: <tspan fill="#00BBF9" font-weight="700">SHA-256 BLOCK #003 VERIFIED</tspan> | FAILOVER: <tspan fill="#A78BFA" font-weight="700">ZERO-DOWNTIME HEURISTICS ARMED</tspan>
      </text>
    </g>
  </g>
</svg>

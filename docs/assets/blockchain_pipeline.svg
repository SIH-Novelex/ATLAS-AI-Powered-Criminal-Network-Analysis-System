<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="blockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="100%" stop-color="#0E172C" />
    </linearGradient>

    <linearGradient id="chainLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F77F00" />
    </linearGradient>

    <filter id="blockGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes hashStream {
      to { stroke-dashoffset: -30; }
    }
    .hash-flow {
      stroke-dasharray: 5, 5;
      animation: hashStream 1s linear infinite;
    }
    .mono { font-family: 'Fira Code', 'Consolas', monospace; }
  </style>

  <rect width="1000" height="240" rx="14" fill="url(#blockBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Section Title -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" fill="#FFD166" class="mono" font-size="14" font-weight="700" letter-spacing="1">
      CRYPTOGRAPHIC EVIDENCE LEDGER • SHA-256 MERKLE CHAIN OF CUSTODY
    </text>
    <text x="0" y="18" fill="#64748B" class="mono" font-size="11">
      Section 65B Indian Evidence Act / BSA Compliance Architecture
    </text>
  </g>

  <!-- Block 001 (Genesis) -->
  <g transform="translate(30, 65)">
    <rect width="260" height="145" rx="8" fill="#0B132B" stroke="#00BBF9" stroke-width="1.5" />
    <rect x="12" y="12" width="90" height="20" rx="4" fill="#00BBF9" fill-opacity="0.2" />
    <text x="57" y="26" fill="#00BBF9" class="mono" font-size="11" font-weight="700" text-anchor="middle">BLOCK #001</text>
    <text x="12" y="52" fill="#E2E8F0" class="mono" font-size="11" font-weight="600">CASE: 2024-001 (Homicide)</text>
    <text x="12" y="72" fill="#64748B" class="mono" font-size="10">PREV: 0000000000000000...</text>
    <text x="12" y="92" fill="#00F5D4" class="mono" font-size="10">MERKLE: 7f83b1657ff1...</text>
    <line x1="12" y1="106" x2="248" y2="106" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="125" r="4" fill="#00E676" />
    <text x="32" y="129" fill="#00E676" class="mono" font-size="10" font-weight="600">STATE: IMMUTABLE</text>
  </g>

  <!-- Connecting Hash Link 1 -->
  <g transform="translate(290, 137)">
    <line class="hash-flow" x1="0" y1="0" x2="60" y2="0" stroke="#FFD166" stroke-width="2" />
    <polygon points="55,-4 65,0 55,4" fill="#FFD166" />
    <text x="30" y="-8" fill="#FFD166" class="mono" font-size="9" text-anchor="middle">SHA256</text>
  </g>

  <!-- Block 002 -->
  <g transform="translate(355, 65)">
    <rect width="260" height="145" rx="8" fill="#0B132B" stroke="#7928CA" stroke-width="1.5" />
    <rect x="12" y="12" width="90" height="20" rx="4" fill="#7928CA" fill-opacity="0.2" />
    <text x="57" y="26" fill="#C77DFF" class="mono" font-size="11" font-weight="700" text-anchor="middle">BLOCK #002</text>
    <text x="12" y="52" fill="#E2E8F0" class="mono" font-size="11" font-weight="600">CASE: 2024-002 (Hawala)</text>
    <text x="12" y="72" fill="#64748B" class="mono" font-size="10">PREV: b5a2c3d4e8f9...</text>
    <text x="12" y="92" fill="#00F5D4" class="mono" font-size="10">MERKLE: a9c41829e120...</text>
    <line x1="12" y1="106" x2="248" y2="106" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="125" r="4" fill="#00E676" />
    <text x="32" y="129" fill="#00E676" class="mono" font-size="10" font-weight="600">STATE: IMMUTABLE</text>
  </g>

  <!-- Connecting Hash Link 2 -->
  <g transform="translate(615, 137)">
    <line class="hash-flow" x1="0" y1="0" x2="60" y2="0" stroke="#FFD166" stroke-width="2" />
    <polygon points="55,-4 65,0 55,4" fill="#FFD166" />
    <text x="30" y="-8" fill="#FFD166" class="mono" font-size="9" text-anchor="middle">SHA256</text>
  </g>

  <!-- Real-Time Delta Block 003 -->
  <g transform="translate(680, 65)">
    <rect width="290" height="145" rx="8" fill="#0B132B" stroke="#00E676" stroke-width="1.5" />
    <rect x="12" y="12" width="130" height="20" rx="4" fill="#00E676" fill-opacity="0.2" />
    <text x="77" y="26" fill="#00E676" class="mono" font-size="11" font-weight="700" text-anchor="middle">BLOCK #003 [DELTA]</text>
    <text x="12" y="52" fill="#E2E8F0" class="mono" font-size="11" font-weight="600">EVENT: STREAM_INGEST</text>
    <text x="12" y="72" fill="#64748B" class="mono" font-size="10">PREV: 4e61d8a7c290...</text>
    <text x="12" y="92" fill="#00F5D4" class="mono" font-size="10">MERKLE: f4d8174a90cb...</text>
    <line x1="12" y1="106" x2="278" y2="106" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="125" r="4" fill="#00E676" />
    <text x="32" y="129" fill="#00E676" class="mono" font-size="10" font-weight="600">CHAIN VERIFIED: VALID</text>
  </g>
</svg>

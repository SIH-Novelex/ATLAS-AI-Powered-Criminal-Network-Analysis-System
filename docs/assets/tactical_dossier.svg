<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%" height="100%">
  <defs>
    <linearGradient id="dossierBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="60%" stop-color="#0E162B" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="60%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>

    <filter id="dossierGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanLaser {
      0% { transform: translateY(0); }
      50% { transform: translateY(140px); }
      100% { transform: translateY(0); }
    }
    @keyframes pulseThreat {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #FF0055); }
    }
    .laser-line {
      animation: scanLaser 3s ease-in-out infinite;
    }
    .threat-pulse {
      animation: pulseThreat 2s ease-in-out infinite;
    }
    .dossier-mono {
      font-family: 'Fira Code', 'Cascadia Code', monospace;
    }
    .dossier-sans {
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Container -->
  <rect width="950" height="380" rx="14" fill="url(#dossierBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Top Confidential Banner -->
  <rect width="950" height="34" rx="14" fill="#0E1726" />
  <rect y="20" width="950" height="14" fill="#0E1726" />
  <line x1="0" y1="34" x2="950" y2="34" stroke="#FF0055" stroke-width="1.5" />
  <rect x="25" y="7" width="165" height="20" rx="4" fill="#FF0055" />
  <text x="107" y="21" fill="#FFFFFF" class="dossier-mono" font-size="10" font-weight="900" text-anchor="middle">SUSPECT DOSSIER #0492</text>
  <text x="205" y="21" fill="#94A3B8" class="dossier-mono" font-size="11">
    INTELLIGENCE SUMMARY // SYNDICATE HIGH VALUE TARGET (HVT)
  </text>
  <circle cx="895" cy="17" r="4" fill="#FF0055" filter="url(#dossierGlow)" />
  <text x="905" y="21" fill="#FF0055" class="dossier-mono" font-size="11" font-weight="700">TARGET LOCKED</text>

  <!-- Left Column: Biometric Scan Wireframe & Threat Meter -->
  <g transform="translate(30, 55)">
    <!-- Photo Box -->
    <rect width="180" height="180" rx="8" fill="#080D1A" stroke="#00F5D4" stroke-width="1.5" />
    
    <!-- Wireframe Silhouette -->
    <g transform="translate(45, 25)" stroke="#00F5D4" stroke-width="1.5" fill="none" opacity="0.8">
      <!-- Head Circle -->
      <circle cx="45" cy="40" r="28" />
      <!-- Shoulders Arc -->
      <path d="M 5 125 C 15 85, 75 85, 85 125 Z" />
      <!-- Crosshairs on Face -->
      <line x1="45" y1="15" x2="45" y2="65" stroke-dasharray="2,2" />
      <line x1="20" y1="40" x2="70" y2="40" stroke-dasharray="2,2" />
      <circle cx="45" cy="40" r="14" stroke="#FF0055" stroke-width="1" />
    </g>

    <!-- Animated Scanning Laser -->
    <line class="laser-line" x1="5" y1="20" x2="175" y2="20" stroke="#FF0055" stroke-width="2" filter="url(#dossierGlow)" />

    <text x="90" y="165" fill="#00F5D4" class="dossier-mono" font-size="9" text-anchor="middle">BIOMETRIC MATCH: 99.4%</text>

    <!-- Threat Level Gauge -->
    <g transform="translate(0, 195)">
      <text x="0" y="15" fill="#64748B" class="dossier-mono" font-size="10" font-weight="700">THREAT COEFFICIENT</text>
      <text x="180" y="15" fill="#FF0055" class="dossier-mono" font-size="12" font-weight="900" text-anchor="end">0.94 [CRITICAL]</text>
      <!-- Gauge Bar Background -->
      <rect y="22" width="180" height="10" rx="5" fill="#1E293B" />
      <!-- Gauge Bar Fill -->
      <rect class="threat-pulse" y="22" width="169" height="10" rx="5" fill="url(#meterGrad)" />
      <text x="0" y="46" fill="#94A3B8" class="dossier-mono" font-size="9">STATUS: WARRANT ISSUED</text>
    </g>
  </g>

  <!-- Right Column: Forensic Details & Centrality Breakdown -->
  <g transform="translate(240, 55)">
    <!-- Identity Header -->
    <text x="0" y="24" fill="#FFFFFF" class="dossier-sans" font-size="22" font-weight="900" letter-spacing="1">
      VIKRAM SINGH <tspan fill="#FFD166" font-size="15" font-weight="700">(ALIAS: 'KABIR')</tspan>
    </text>
    <text x="0" y="44" fill="#FF0055" class="dossier-mono" font-size="12" font-weight="700">
      SYNDICATE ROLE: COMMANDER &amp; FINANCIAL LOGISTICS ARCHITECT
    </text>

    <!-- Graph Centrality Metrics Table -->
    <g transform="translate(0, 60)">
      <!-- Metric 1: PageRank -->
      <rect width="210" height="60" rx="6" fill="#0A1124" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="22" fill="#64748B" class="dossier-mono" font-size="10" font-weight="700">PAGERANK CENTRALITY</text>
      <text x="14" y="47" fill="#00F5D4" class="dossier-mono" font-size="20" font-weight="900">0.084 <tspan fill="#64748B" font-size="11" font-weight="500">(Rank #1)</tspan></text>

      <!-- Metric 2: Betweenness Centrality -->
      <g transform="translate(225, 0)">
        <rect width="210" height="60" rx="6" fill="#0A1124" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="22" fill="#64748B" class="dossier-mono" font-size="10" font-weight="700">BETWEENNESS SCORE</text>
        <text x="14" y="47" fill="#00BBF9" class="dossier-mono" font-size="20" font-weight="900">0.421 <tspan fill="#64748B" font-size="11" font-weight="500">(Bridge Node)</tspan></text>
      </g>

      <!-- Metric 3: Direct Edges -->
      <g transform="translate(450, 0)">
        <rect width="220" height="60" rx="6" fill="#0A1124" stroke="#1E293B" stroke-width="1" />
        <text x="14" y="22" fill="#64748B" class="dossier-mono" font-size="10" font-weight="700">GRAPH DEGREE</text>
        <text x="14" y="47" fill="#7928CA" class="dossier-mono" font-size="20" font-weight="900">42 Edges <tspan fill="#64748B" font-size="11" font-weight="500">(Hub)</tspan></text>
      </g>
    </g>

    <!-- Syndicate Asset & Link Portfolio -->
    <g transform="translate(0, 135)">
      <rect width="670" height="95" rx="6" fill="#080E1C" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="22" fill="#00F5D4" class="dossier-mono" font-size="11" font-weight="700">IDENTIFIED SYNDICATE ASSETS (CYPHER MERGE):</text>
      
      <text x="14" y="44" fill="#E2E8F0" class="dossier-mono" font-size="11">
        • <tspan fill="#FFD166" font-weight="700">4 Shell Entities:</tspan> Apex Global Exports Ltd, Horizon Tradelinks (Shared Dummy Address)
      </text>
      <text x="14" y="64" fill="#E2E8F0" class="dossier-mono" font-size="11">
        • <tspan fill="#FF0055" font-weight="700">6 Mule Accounts:</tspan> ACCT-001 to ACCT-006 (₹2.4 Crore layered via Hawala ring)
      </text>
      <text x="14" y="84" fill="#E2E8F0" class="dossier-mono" font-size="11">
        • <tspan fill="#00BBF9" font-weight="700">14 Recycled SIMs:</tspan> Bound to IMEI 864201938472910 (Burner Device Swap pattern)
      </text>
    </g>

    <!-- Multi-Jurisdiction Cross-Case Proof -->
    <g transform="translate(0, 242)">
      <rect width="670" height="65" rx="6" fill="#080E1C" stroke="#7928CA" stroke-width="1" />
      <text x="14" y="20" fill="#C77DFF" class="dossier-mono" font-size="11" font-weight="700">
        CROSS-CASE LINK DISCOVERY (AUTONOMOUS GRAPH ENGINE):
      </text>
      <text x="14" y="40" fill="#94A3B8" class="dossier-mono" font-size="11">
        Found bridging <tspan fill="#FFFFFF" font-weight="700">CASE-2024-001</tspan> (Homicide - FIR 104) &amp; <tspan fill="#FFFFFF" font-weight="700">CASE-2024-002</tspan> (Hawala - FIR 219).
      </text>
      <text x="14" y="56" fill="#00E676" class="dossier-mono" font-size="10" font-weight="700">
        LEGAL STATUS: Section 65B Certified SHA-256 Merkle Block #002 Anchored in Ledger
      </text>
    </g>
  </g>
</svg>
